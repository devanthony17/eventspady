<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#191970" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131320" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="apple-touch-icon" href="/images/mark.svg" />
    <link rel="canonical" href="https://eventspady.com/" />

    <title>Eventspady — Discover, Book & Manage Unforgettable Events</title>
    <meta
      name="description"
      content="Eventspady is a premium event booking and management platform. Create listings, sell tickets, process payments, scan QR check-ins and manage guests — all in one place."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the stored theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('eventspady:theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-white text-ink-900 antialiased dark:bg-ink-950 dark:text-ink-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
